services:
  server:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/app:z
    depends_on:
      - php
    networks:
      - app-network
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app:z
    networks:
      - app-network
networks:
  app-network: